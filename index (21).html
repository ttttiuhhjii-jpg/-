<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eff7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>عضوگیر روبیکا</title>
<style>
:root{--bg:#fdf7ff;--bar:#f3eff7;--pri:#0288d1;--red:#b3261e;--txt:#1d1b20;--mut:#605d66;--bd:#cac4d0;--ok:#1b8a4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.7;overscroll-behavior-y:contain}
body{min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top)}
button,input,textarea,select{font-family:inherit;font-size:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{background:var(--bar);display:flex;align-items:center;gap:10px;padding:14px 14px;position:sticky;top:0;z-index:5}
.top .ttl{flex:1;font-size:19px;font-weight:600}
.ic{border:0;background:none;font-size:26px;line-height:1;padding:2px 6px;cursor:pointer;color:var(--txt);display:flex;align-items:center}
svg{vertical-align:middle;flex:none}
.pill{background:var(--red);color:#fff;border-radius:14px;padding:5px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.body{flex:1;padding:14px 14px 100px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--bar);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:0}
nav button .i{font-size:22px;height:36px;min-width:60px;border-radius:18px;display:flex;align-items:center;justify-content:center}
nav button.on{color:var(--txt);font-weight:700}
nav button.on .i{background:var(--pri);color:#fff}
.card{background:var(--bg);border:1.5px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:17px}
.mut{color:var(--mut);font-size:14px}
.btn{border:0;border-radius:16px;padding:13px 18px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:#e1f1fa;color:#01577f}
.btn.gray{background:#ece6f0;color:var(--txt)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.block{display:block;width:100%}
input[type=text],input[type=tel],input[type=number],textarea,select{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:18px;background:#fff;margin:4px 0 12px;direction:rtl}
input.ltr{direction:ltr;text-align:right}
textarea{min-height:130px;resize:vertical}
label.l{font-size:13px;color:var(--mut)}
.tog{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:20px}
.vr{width:1px;align-self:stretch;background:var(--bd)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:1;font-size:14px;cursor:pointer;line-height:1.3}
.sw input{display:none}
.sw i{width:52px;height:30px;border-radius:15px;background:#e6e0e9;position:relative;transition:.2s;flex:none}
.sw i::after{content:'';position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:50%;background:#79747e;transition:.2s}
.sw input:checked+i{background:var(--pri)}
.sw input:checked+i::after{left:27px;background:#fff}
.cap{text-align:center;font-size:17px;margin:6px 4px 14px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;margin:0 auto;box-shadow:0 2px 12px #0003;overflow:hidden;user-select:none}
.chname{text-align:center;font-size:22px;margin:14px 0 4px;direction:ltr;word-break:break-all}
.chsub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:6px}
.chk{display:flex;justify-content:space-between;gap:10px;margin:18px 2px}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;flex:1;line-height:1.35}
.ck input{display:none}
.ck i{width:26px;height:26px;border-radius:5px;border:2.5px solid #79747e;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:17px}
.ck input:checked+i{background:var(--pri);border-color:var(--pri)}
.ck input:checked+i::after{content:'✓'}
.acts{display:flex;gap:12px;margin-top:6px}
.acts .ob{display:flex;align-items:center;justify-content:center;width:92px;height:76px;border-radius:22px;border:1.5px solid #79747e;background:var(--bg);font-size:30px;cursor:pointer;color:var(--pri)}
.acts .main{flex:1;height:76px;border-radius:22px;border:0;background:var(--pri);color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px}
.acts .main:disabled{opacity:.6}
.svc{display:flex;flex-direction:column;gap:8px}
.svc .row{display:flex;align-items:flex-start;gap:12px}
.svc .ico{font-size:34px;width:56px;text-align:center;flex:none}
.svc .row b{font-size:18px;line-height:1.5;display:block}
h2.big{color:var(--pri);font-size:26px;margin:30px 0 8px;text-align:right;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:36px 0}
.bar{height:9px;background:#e6e0e9;border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar>div{height:100%;background:var(--pri)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{display:inline-block;background:#e1f1fa;color:#01577f;border-radius:10px;padding:1px 10px;font-size:12px;font-weight:700}
.tx{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:14px;gap:10px}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--red);font-weight:700}
details{border:1.5px solid var(--bd);border-radius:22px;padding:14px 16px;margin-bottom:12px;background:var(--bg)}
details summary{cursor:pointer;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details summary::after{content:'▾';color:var(--pri)}
details[open] summary::after{content:'▴'}
details p{margin:10px 0 0;color:var(--mut);font-size:14px}
.faqbox{background:var(--bar);border-radius:24px;padding:16px;margin-top:10px}
.ovl{position:fixed;inset:0;background:#0008;z-index:20;display:flex}
.drawer{background:var(--bg);width:82%;max-width:360px;height:100%;overflow:auto;padding:0 0 12px;border-radius:24px 0 0 24px;margin-right:0;margin-left:auto}
.drawer .di{display:flex;align-items:center;gap:16px;padding:14px 22px;font-size:17px;cursor:pointer;border:0;background:none;width:100%;text-align:right;color:var(--txt)}
.drawer .di span:first-child{width:34px;display:flex;justify-content:center;color:var(--mut)}
.drawer hr{border:0;border-top:1.5px solid var(--bd);margin:8px 22px}
.drawer .who{padding:6px 22px 10px;color:var(--mut);font-size:13px}
.sheet{background:var(--bg);margin:auto 0 0;width:100%;max-width:480px;align-self:flex-end;border-radius:24px 24px 0 0;padding:18px 18px 26px;margin-inline:auto}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#322f35;color:#fff;padding:10px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90%;text-align:center}
#toast.show{opacity:1}#toast.err{background:var(--red)}
.chat{background:#ece6f0;border-radius:14px;padding:8px;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.chat .m{max-width:88%;padding:6px 11px;border-radius:14px;font-size:13px;background:#fff}
.chat .m.me{align-self:flex-start;background:#d6f5df}
.chat .m small{display:block;color:var(--mut);font-size:11px}
.steps{margin:6px 0 12px;padding-right:20px;color:var(--mut);font-size:14px}
.code{letter-spacing:8px;text-align:center!important;font-size:22px;font-weight:700}
.pk{position:relative;display:flex;align-items:center;gap:14px;border:1.5px solid var(--bd);border-radius:26px;padding:22px 18px;margin-bottom:16px;background:var(--bg);cursor:pointer;width:100%;text-align:right;color:var(--txt)}
.pk:active{background:var(--bar)}
.pk:disabled{opacity:.6;cursor:default}
.pk .pi{position:relative;flex:none;width:68px;height:68px;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.pk .off{position:absolute;top:-26px;right:-8px;background:var(--red);color:#fff;border-radius:14px;padding:2px 12px;font-size:14px;font-weight:700}
.pk .cn{flex:1;font-size:21px;font-weight:600}
.pk .pr{text-align:left;direction:rtl;min-width:120px}
.pk .pr b{display:block;color:var(--pri);font-size:24px;font-weight:600;line-height:1.5}
.pk .pr s{display:block;color:var(--mut);font-size:17px;line-height:1.4}
.wheelw{position:relative;width:250px;height:250px;margin:24px auto 14px}
.wheel{width:250px;height:250px;border-radius:50%;position:relative;border:6px solid var(--pri);transition:transform 4s cubic-bezier(.1,.7,.1,1)}
.wheel span{position:absolute;left:50%;top:50%;font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 2px #0006}
.ptr{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:28px;color:var(--red);z-index:2}
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--bd)}
.rank .n{width:28px;text-align:center;font-weight:700;color:var(--pri)}
.rank .s{margin-inline-start:auto;font-weight:700}
.tabs2{display:flex;border-bottom:1.5px solid var(--bd);margin:-14px -14px 16px}
.tabs2 button{flex:1;border:0;background:none;padding:14px 0;font-size:17px;color:var(--mut);cursor:pointer;position:relative}
.tabs2 button.on{color:var(--pri)}
.tabs2 button.on::after{content:'';position:absolute;bottom:-1.5px;left:50%;transform:translateX(-50%);width:56px;height:5px;background:var(--pri);border-radius:5px 5px 0 0}
.oc{background:var(--bar);border:1.5px solid var(--bd);border-radius:22px;padding:14px 18px;margin-bottom:16px}
.oh{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1.5px solid var(--bd);color:var(--mut);font-size:15px}
.oh .ot{color:var(--txt);font-size:16px}
.ob2{display:flex;align-items:center;gap:14px;padding-top:14px}
.ring{border:4px solid var(--pri);border-radius:50%;padding:3px;flex:none}
.oinfo{flex:1;min-width:0;font-size:15px;color:var(--mut)}
.oinfo b{color:var(--txt)}
.oid{font-size:24px;color:var(--txt);direction:ltr;text-align:right;word-break:break-all;line-height:1.3;margin-bottom:4px}
.ost{text-align:center;color:var(--pri);font-size:15px;min-width:78px}
.pc{font-size:20px;font-weight:700}
.ck2{width:44px;height:44px;border-radius:50%;border:3px solid var(--pri);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 4px}
.lnk{display:block;margin:4px auto 0;border:0;background:none;color:var(--red);cursor:pointer;font-size:13px}
.dh{background:var(--pri);color:#fff;padding:26px 22px 16px}
.dh .dav{width:86px;height:86px;border-radius:50%;border:3px solid #fff;overflow:hidden;display:flex}
.dh .dav .av{box-shadow:none;width:100%!important;height:100%!important}
.dh .dots{border:0;background:none;color:#fff;font-size:28px;line-height:1;padding:6px 0;cursor:pointer;display:block;margin-top:14px}
.dh .drow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.dh .ph{font-size:20px;letter-spacing:1px}
.dh .car{border:0;background:none;color:#fff;font-size:20px;cursor:pointer}
.dsec{padding:16px 22px 6px;color:var(--mut);font-size:16px}
.acr{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;font-size:19px;cursor:pointer;border:0;background:none;width:100%;color:var(--mut);text-align:right}
.acr.on{color:var(--txt);font-weight:600}
.acr .chkc{width:32px;height:32px;border-radius:50%;background:#79747e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.hic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.hic.in{background:#e3f4ea;color:var(--ok)}
.hic.out{background:#fbe5e3;color:var(--red)}
.mode{font-size:11px;background:#e1f1fa;color:#01577f;padding:1px 8px;border-radius:8px;margin-inline-start:6px;font-weight:400}
.emos{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.emo{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--bd);background:#fff;font-size:24px;cursor:pointer;padding:0}
.emo.on{border-color:var(--pri);background:#e1f1fa}
details summary .badge{margin-inline-start:auto}
.admbox{background:var(--bg);width:100%;max-width:480px;margin:0 auto;overflow:auto}
.admbox .top{z-index:6}
.adu:active{background:var(--bar)}
</style>

/* ============================================================
   لایه‌ی API — همه‌ی صفحه‌ها فقط از api.xxx() استفاده می‌کنند
   ============================================================ */
/* ------------------------------------------------------------
   قرارداد API (حالت remote)
   همه‌ی مسیرها: POST  BASE_URL/<name>  با بدنه‌ی JSON
   هدرها: Authorization: Bearer <token>  — و برای عملیات تغییردهنده Idempotency-Key
   خطا: کد غیر 2xx با بدنه‌ی {"error": "پیام فارسی"} — کد 401 یعنی نشست منقضی شده
   سکه، پاداش، هزینه و قیمت‌ها را فقط سرور حساب و ذخیره می‌کند؛ هر مقداری از کلاینت فقط درخواست است.

   requestCode   {phone}                      → {sent:true, phone, ttl} | {needBot:true, phone}
   verifyCode    {phone, code}                → {id, username, phone, coins, token}
   me            {}                           → {id, username, phone, coins}
   logout        {}                           → {}                       (توکن را باطل کن)
   tasks         {}                           → [{id, title, link, left, reward}]   فقط سفارش‌های «عضو» دیگران
   verifyJoin    {orderId}                    → {coins, reward}          (عضویت را از روبیکا چک کن)
   report        {orderId, reason}            → {}
   createOrder   {type, link, title?, count, emoji?, option?}  → {coins}
                 type: members | seen | react | poll
   myOrders      {}                           → [{id, type, title, link, target, done, created, emoji?, option?}]
   cancelOrder   {orderId}                    → {coins, back}
   transactions  {}                           → [{id, amount, note, kind, t}]
   buyCoins      {pack, sku, token, orderId}  → {coins}                  (به تابع جدا myketpay می‌رود؛ سرور token را با API مایکت راستی‌آزمایی می‌کند و فقط یک‌بار سکه می‌دهد)
   transfer      {phone, amount}              → {coins}
   transferHistory {}                         → [{id, amount, note, t}]
   invite        {}                           → {code, used, count, bonus}
   useInvite     {code}                       → {coins}
   wheelInfo     {}                           → {prizes:[...], waitMs}
   wheelSpin     {}                           → {index, prize, coins}
   leaderboard   {}                           → [{name, score, me}]
   ticketCreate  {subject, text}              → {}
   ticketList    {}                           → [{id, subject, text, status, reply?, t}]

   accounts و switchAccount سمت کلاینت انجام می‌شوند (توکن هر اکانت در حافظه‌ی دستگاه می‌ماند).
   ------------------------------------------------------------ */
const Session = (() => {
  const K = 'rb_sessions';
  let st; try { st = JSON.parse(localStorage.getItem(K)) } catch {}
  st = st && Array.isArray(st.list) ? st : {list: [], active: null};
  const save = () => { try { localStorage.setItem(K, JSON.stringify(st)) } catch {} };
  return {
    get token() { const a = st.list.find(x => x.id === st.active); return a ? a.token : ''; },
    get list() { return st.list; },
    get active() { return st.active; },
    add(u) { st.list = st.list.filter(x => x.id !== u.id); st.list.push({id: u.id, phone: u.phone, token: u.token}); st.active = u.id; save(); },
    use(id) { if (!st.list.some(x => x.id === id)) return false; st.active = id; save(); return true; },
    drop(id = st.active) { st.list = st.list.filter(x => x.id !== id); if (st.active === id) st.active = st.list[0] ? st.list[0].id : null; save(); }
  };
})();

const MUTATING = new Set(['createOrder', 'buyCoins', 'transfer', 'wheelSpin', 'useInvite', 'cancelOrder', 'verifyJoin', 'ticketCreate']);
const inflight = new Set();
const newKey = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);

async function call(name, payload) {
  const headers = {'Content-Type': 'application/json'};
  if (Session.token) headers['Authorization'] = 'Bearer ' + Session.token;
  if (MUTATING.has(name)) headers['Idempotency-Key'] = newKey();     // کلید ثابت بین تلاش‌های مجدد → عملیات دوبار انجام نمی‌شود
  const tries = (name === 'verifyCode' || name === 'logout') ? 1 : 3;   // کد ورود یک‌بارمصرف است؛ تکرار نمی‌شود
  let res, lastErr;
  for (let i = 0; i < tries && !res; i++) {
    if (i) await new Promise(r => setTimeout(r, 700));
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), CONFIG.TIMEOUT_MS);
    try { res = await fetch((name === 'buyCoins' ? CONFIG.BASE_URL.replace(/\/api$/, '/myketpay') : CONFIG.BASE_URL) + '/' + name, {method: 'POST', headers, body: JSON.stringify(payload), signal: ctl.signal}); }
    catch (e) { lastErr = e; }
    finally { clearTimeout(timer); }
  }
  if (!res) throw new Error(lastErr && lastErr.name === 'AbortError' ? 'پاسخ سرور دیر رسید؛ دوباره امتحان کن' : 'اتصال به سرور برقرار نشد؛ اینترنت یا VPN را بررسی کن (' + ((lastErr && lastErr.message) || 'network') + ')');
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && name !== 'requestCode' && name !== 'verifyCode') {
    const e = new Error(data.error || 'نشست شما منقضی شده؛ دوباره وارد شوید'); e.code = 401; throw e;
  }
  if (!res.ok) throw new Error(data.error || 'خطای سرور');
  return data;
}

const Remote = {
  async me() {
    if (!Session.token) return null;
    try { return await call('me', {}) } catch (e) { if (e.code === 401) { Session.drop(); return null } throw e; }
  },
  async accounts() { return Session.list.map(a => ({id: a.id, phone: a.phone, active: a.id === Session.active})); },
  async switchAccount({id}) {
    const prev = Session.active;
    if (!Session.use(id)) throw new Error('اکانت پیدا نشد');
    const u = await Remote.me();
    if (!u) { Session.use(prev); throw new Error('نشست این اکانت منقضی شده؛ دوباره وارد شوید'); }
    return u;
  },
  async verifyCode(p) { const d = await call('verifyCode', p); Session.add(d); const {token, ...u} = d; return u; },
  async logout() { try { await call('logout', {}) } catch {} Session.drop(); return {}; }
};

const api = new Proxy({}, {
  get: (_, name) => async (payload = {}) => {
    if (MUTATING.has(name)) {          // جلوگیری از ارسال دوباره‌ی درخواست با دو بار لمس
      if (inflight.has(name)) throw new Error('درخواست قبلی هنوز در حال انجام است');
      inflight.add(name);
    }
    try {
      if (CONFIG.MODE === 'mock') { await sleep(120); return await Mock[name](payload); }
      return Remote[name] ? await Remote[name](payload) : await call(name, payload);
    } finally { inflight.delete(name); }
  }
});

/* ============================================================
   سرور شبیه‌سازی‌شده (ذخیره در localStorage)
   ============================================================ */
const makeMock = () => {
  const KEY = 'rb_mock_db_v3';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null } catch { return null } };
  const save = d => localStorage.setItem(KEY, JSON.stringify(d));
  const now = () => Date.now();
  const uid = () => Math.random().toString(36).slice(2, 10);
  const genCode = () => Array.from({length: 6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
  const dayStart = () => new Date().setHours(0, 0, 0, 0);
  const WHEEL = [0, 1, 2, 3, 5, 10, 20], WEIGHTS = [30, 25, 20, 12, 8, 4, 1];

  function seed() {
    const demoUsers = [['سارا', 64], ['امیرعلی', 51], ['نگین', 38], ['رضا', 27], ['مهسا', 15]];
    const users = {bot: {id: 'bot', username: 'سیستم', coins: 0, joined: [], created: now()}};
    demoUsers.forEach(([n, s]) => { const id = uid(); users[id] = {id, username: n, coins: 100, joined: [], seed: s, created: now()}; });
    const demo = [
      ['اخبار فناوری', 'tech_news_demo', 120, 37], ['آشپزی خانگی', 'cook_home_demo', 80, 12],
      ['فیلم و سریال', 'movie_hub_demo', 200, 91], ['کسب‌وکار آنلاین', 'biz_online_demo', 60, 5],
      ['ورزش ۳۶۰', 'sport360_demo', 150, 66]
    ];
    return {
      users,
      orders: demo.map(([title, id, target, done]) => ({id: uid(), owner: 'bot', title, link: 'https://rubika.ir/' + id, target, done, created: now()})),
      tx: [], session: null, botLinked: {}, botInbox: {}, codes: {}, reports: {}, tickets: [],
      accounts: []
    };
  }
  let db = load() || (save(seed()), load());
  db.accounts = db.accounts || []; delete db.chat;
  if (db.session && !db.accounts.includes(db.session)) db.accounts.push(db.session);
  const commit = () => save(db);
  const me = () => { const u = db.users[db.session]; if (!u) throw new Error('ابتدا وارد شوید'); return u; };
  const addTx = (u, amount, note, kind) => { db.tx.unshift({id: uid(), user: u.id, amount, note, kind: kind || 'other', t: now()}); };
  const pub = u => ({id: u.id, username: u.username, phone: u.phone, coins: u.coins});
  const earnToday = u => (u.seed || 0) + db.tx.filter(t => t.user === u.id && t.kind === 'earn' && t.t >= dayStart()).reduce((a, t) => a + t.amount, 0);

  function normPhone(raw) {
    let s = (raw || '').replace(/[\s\-]/g, '')
      .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    s = s.replace(/^\+98/, '0').replace(/^0098/, '0').replace(/^98/, '0');
    if (!/^09\d{9}$/.test(s)) throw new Error('شماره موبایل معتبر نیست (مثال: 09123456789)');
    return s;
  }
  function normLink(raw) {
    let s = (raw || '').trim().replace(/^https?:\/\//, '').replace(/^rubika\.ir\//, '').replace(/^@/, '');
    if (!/^[A-Za-z0-9_]{3,40}$/.test(s)) throw new Error('لینک یا آیدی کانال معتبر نیست');
    return 'https://rubika.ir/' + s;
  }
  function normPostLink(raw) {
    const s = (raw || '').trim().replace(/^https?:\/\//, '').replace(/^rubika\.ir\//, '').replace(/^@/, '');
    if (!/^[A-Za-z0-9_]{3,40}\/[^\s\/]{1,80}$/.test(s)) throw new Error('لینک پست معتبر نیست (مثال: rubika.ir/mychannel/Abc123)');
    return 'https://rubika.ir/' + s;
  }

  return {
    /* ---------- ورود با شماره + کد از ربات ---------- */
    async requestCode({phone}) {
      phone = normPhone(phone);
      if (!db.botLinked[phone]) return {needBot: true, phone};
      const last = db.codes[phone];
      if (last && now() - last.t < 30000) throw new Error('چند ثانیه صبر کنید و دوباره امتحان کنید');
      const code = String(Math.floor(10000 + Math.random() * 90000));
      db.codes[phone] = {code, t: now(), tries: 0};
      (db.botInbox[phone] = db.botInbox[phone] || []).push({from: 'bot', t: now(),
        text: `کد ورود شما: ${code}\nاعتبار: ${CONFIG.CODE_TTL / 60} دقیقه\nاین کد را به هیچ‌کس ندهید.`});
      commit(); return {sent: true, phone, ttl: CONFIG.CODE_TTL};
    },
    async verifyCode({phone, code}) {
      phone = normPhone(phone);
      const c = db.codes[phone];
      if (!c) throw new Error('ابتدا کد را درخواست کنید');
      if (now() - c.t > CONFIG.CODE_TTL * 1000) { delete db.codes[phone]; commit(); throw new Error('کد منقضی شده؛ دوباره درخواست کنید'); }
      if (c.tries >= 5) { delete db.codes[phone]; commit(); throw new Error('تلاش بیش از حد؛ کد جدید بگیرید'); }
      if (String(code).trim() !== c.code) { c.tries++; commit(); throw new Error('کد اشتباه است'); }
      delete db.codes[phone];
      let u = Object.values(db.users).find(x => x.phone === phone);
      if (!u) {
        u = {id: uid(), phone, username: phone.slice(0, 4) + '***' + phone.slice(-3), coins: CONFIG.START_COINS,
             joined: [], invite: genCode(), created: now()};
        db.users[u.id] = u; addTx(u, CONFIG.START_COINS, 'هدیه‌ی ثبت‌نام');
      }
      if (!db.accounts.includes(u.id)) db.accounts.push(u.id);
      db.session = u.id; commit(); return pub(u);
    },
    async botStart({phone}) {   // فقط حالت آزمایشی؛ در نسخه‌ی واقعی کار ربات روبیکاست
      phone = normPhone(phone); db.botLinked[phone] = true;
      const box = (db.botInbox[phone] = db.botInbox[phone] || []);
      box.push({from: 'me', text: '/start', t: now()}, {from: 'me', text: '📱 ' + phone + ' (اشتراک شماره)', t: now()},
        {from: 'bot', text: 'سلام! شماره‌ی شما تأیید شد ✅\nحالا به برنامه برگردید تا کد ورود را اینجا دریافت کنید.', t: now()});
      commit(); return {};
    },
    async botInbox({phone}) { return db.botInbox[normPhone(phone)] || []; },
    async logout() { db.accounts = db.accounts.filter(id => id !== db.session); db.session = db.accounts[0] || null; commit(); return {}; },
    async accounts() { me(); return db.accounts.map(id => db.users[id]).filter(Boolean).map(u => ({id: u.id, phone: u.phone, active: u.id === db.session})); },
    async switchAccount({id}) { if (!db.accounts.includes(id)) throw new Error('اکانت پیدا نشد'); db.session = id; commit(); return pub(db.users[id]); },
    async me() { try { return pub(me()) } catch { return null } },

    /* ---------- کسب سکه ---------- */
    async tasks() {
      const u = me();
      return db.orders
        .filter(o => (o.type || 'members') === 'members' && o.owner !== u.id && o.done < o.target && !u.joined.includes(o.id) && (db.reports[o.id] || []).length < 3 && !(db.reports[o.id] || []).includes(u.id))
        .map(o => ({id: o.id, title: o.title, link: o.link, left: o.target - o.done, reward: CONFIG.JOIN_REWARD}));
    },
    async verifyJoin({orderId}) {
      const u = me(); const o = db.orders.find(x => x.id === orderId);
      if (!o) throw new Error('سفارش پیدا نشد');
      if (u.joined.includes(o.id)) throw new Error('قبلاً عضو شده‌اید');
      if (o.done >= o.target) throw new Error('ظرفیت این کانال تکمیل شده');
      // نسخه‌ی واقعی: سرور باید عضویت را از روبیکا چک کند. اینجا همیشه تأیید می‌شود.
      u.joined.push(o.id); o.done++;
      u.coins += CONFIG.JOIN_REWARD; addTx(u, CONFIG.JOIN_REWARD, 'عضویت در ' + o.title, 'earn');
      commit(); return {coins: u.coins, reward: CONFIG.JOIN_REWARD};
    },
    async report({orderId, reason}) {
      const u = me(); (db.reports[orderId] = db.reports[orderId] || []).push(u.id);
      commit(); return {};
    },

    /* ---------- سفارش ---------- */
    async createOrder({type, link, title, count, emoji, option}) {
      const u = me(); type = type || 'members'; const S = CONFIG.SERVICES[type];
      if (!S) throw new Error('نوع سرویس نامعتبر است');
      const o = {id: uid(), owner: u.id, type, done: 0, created: now()};
      if (type === 'members') {
        o.link = normLink(link); o.title = (title || '').trim();
        if (!o.title) throw new Error('نام کانال را بنویسید');
      } else {
        o.link = normPostLink(link); o.title = '';
        if (type === 'react') { if (!CONFIG.REACTIONS.includes(emoji)) throw new Error('یک واکنش انتخاب کن'); o.emoji = emoji; }
        if (type === 'poll') {
          option = parseInt(option, 10);
          if (!option || option < 1 || option > 10) throw new Error('شماره‌ی گزینه باید بین ۱ تا ۱۰ باشد');
          o.option = option;
        }
      }
      count = parseInt(count, 10);
      if (!count || count < S.min || count > S.max) throw new Error(`تعداد باید بین ${fa(S.min)} تا ${fa(S.max)} باشد`);
      const cost = orderCost(type, count);
      if (u.coins < cost) throw new Error(`سکه کافی نیست (نیاز: ${fa(cost)})`);
      o.target = count;
      u.coins -= cost; addTx(u, -cost, `سفارش ${fa(count)} ${S.noun} برای ${o.title || o.link.replace('https://rubika.ir/', '')}`, 'order');
      db.orders.unshift(o);
      commit(); return {coins: u.coins};
    },
    async myOrders() {
      const u = me();
      return db.orders.filter(o => o.owner === u.id).map(o => ({id: o.id, type: o.type || 'members', title: o.title, link: o.link,
        target: o.target, done: o.done, created: o.created, emoji: o.emoji, option: o.option}));
    },
    async cancelOrder({orderId}) {
      const u = me(); const i = db.orders.findIndex(o => o.id === orderId && o.owner === u.id);
      if (i < 0) throw new Error('سفارش پیدا نشد');
      const o = db.orders[i], back = Math.floor((o.target - o.done) * CONFIG.SERVICES[o.type || 'members'].unit + 1e-9);
      u.coins += back; addTx(u, back, 'بازگشت سکه‌ی سفارش لغوشده'); db.orders.splice(i, 1);
      commit(); return {coins: u.coins, back};
    },

    /* ---------- کیف پول و خرید ---------- */
    async transactions() { const u = me(); return db.tx.filter(t => t.user === u.id).slice(0, 60); },
    async buyCoins({pack}) {   // حالت آزمایشی: پرداخت شبیه‌سازی می‌شود. نسخه‌ی واقعی: پرداخت + تأیید در سرور
      const u = me(); const p = CONFIG.PACKS[pack]; if (!p) throw new Error('بسته نامعتبر است');
      u.coins += p[0]; addTx(u, p[0], 'خرید سکه (آزمایشی)', 'buy'); commit(); return {coins: u.coins};
    },
    async transfer({phone, amount}) {
      const u = me(); phone = normPhone(phone); amount = parseInt(amount, 10);
      if (!amount || amount < 5) throw new Error('حداقل انتقال ۵ سکه است');
      if (u.phone === phone) throw new Error('نمی‌توانید به خودتان منتقل کنید');
      const t = Object.values(db.users).find(x => x.phone === phone);
      if (!t) throw new Error('کاربری با این شماره در برنامه نیست');
      if (u.coins < amount) throw new Error('سکه کافی نیست');
      u.coins -= amount; t.coins += amount;
      addTx(u, -amount, 'ارسال به ' + phone.slice(0, 4) + '***' + phone.slice(-3), 'send'); addTx(t, amount, 'دریافت از ' + u.username, 'recv');
      commit(); return {coins: u.coins};
    },

    async transferHistory() {
      const u = me();
      return db.tx.filter(t => t.user === u.id && (t.kind === 'send' || t.kind === 'recv' || /^(انتقال به|ارسال به|دریافت از) /.test(t.note)))
        .slice(0, 50).map(t => ({id: t.id, amount: t.amount, note: t.note, t: t.t}));
    },

    /* ---------- دعوت، گردونه، برترین‌ها ---------- */
    async invite() { const u = me(); if (!u.invite) { u.invite = genCode(); commit(); }
      return {code: u.invite, used: !!u.invitedBy, count: Object.values(db.users).filter(x => x.invitedBy === u.id).length, bonus: CONFIG.INVITE_BONUS}; },
    async useInvite({code}) {
      const u = me(); if (u.invitedBy) throw new Error('قبلاً کد معرف وارد کرده‌اید');
      const o = Object.values(db.users).find(x => x.invite && x.invite === (code || '').trim().toUpperCase());
      if (!o) throw new Error('کد معرف پیدا نشد'); if (o.id === u.id) throw new Error('کد خودتان را نمی‌توانید وارد کنید');
      u.invitedBy = o.id; u.coins += CONFIG.INVITE_BONUS; o.coins += CONFIG.INVITE_BONUS;
      addTx(u, CONFIG.INVITE_BONUS, 'جایزه‌ی کد معرف'); addTx(o, CONFIG.INVITE_BONUS, 'جایزه‌ی دعوت از ' + u.username);
      commit(); return {coins: u.coins};
    },
    async wheelInfo() { const u = me(); const left = Math.max(0, 864e5 - (now() - (u.lastWheel || 0))); return {prizes: WHEEL, waitMs: left}; },
    async wheelSpin() {
      const u = me(); const left = 864e5 - (now() - (u.lastWheel || 0));
      if (left > 0) throw new Error(`گردونه ${Math.ceil(left / 36e5)} ساعت دیگر آماده است`);
      let r = Math.random() * WEIGHTS.reduce((a, b) => a + b), i = 0;
      while (r >= WEIGHTS[i]) { r -= WEIGHTS[i]; i++; }
      u.lastWheel = now(); if (WHEEL[i]) { u.coins += WHEEL[i]; addTx(u, WHEEL[i], 'گردونه شانس', 'wheel'); }
      commit(); return {index: i, prize: WHEEL[i], coins: u.coins};
    },
    async leaderboard() {
      const u = me();
      return Object.values(db.users).filter(x => x.id !== 'bot').map(x => ({name: x.username, score: earnToday(x), me: x.id === u.id}))
        .sort((a, b) => b.score - a.score).slice(0, 10);
    },

    /* ---------- پشتیبانی ---------- */
    async ticketCreate({subject, text}) {
      const u = me(); subject = (subject || '').trim(); text = (text || '').trim();
      if (!subject || text.length < 5) throw new Error('موضوع و متن پیام را کامل بنویسید');
      db.tickets.unshift({id: uid(), user: u.id, subject, text, t: now(), status: 'در انتظار پاسخ'}); commit(); return {};
    },
    async ticketList() { const u = me(); return db.tickets.filter(t => t.user === u.id); },

    /* ---------- ابزار تست (فقط حالت آزمایشی) ---------- */
    async devSimulate() {
      const u = me(); const mine = db.orders.filter(o => o.owner === u.id && o.done < o.target);
      if (!mine.length) throw new Error('سفارش فعالی ندارید');
      mine.forEach(o => o.done = Math.min(o.target, o.done + Math.ceil(o.target * 0.25))); commit(); return {};
    },
    async devComplete() { const u = me(); db.orders.filter(o => o.owner === u.id).forEach(o => o.done = o.target); commit(); return {}; },
    async devAddCoins() { const u = me(); u.coins += 100; addTx(u, 100, 'سکه‌ی تستی'); commit(); return {coins: u.coins}; },
    async devResetWheel() { const u = me(); u.lastWheel = 0; commit(); return {}; },
    async devReset() { localStorage.removeItem(KEY); db = seed(); save(db); return {}; }
  };
};

const icon = (n, s = 24) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" ${n === 'dots' ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'} aria-hidden="true">${ICONS[n] || ''}</svg>`;

const NAV = [['support','headset','پشتیبانی'], ['orders','list','لیست سفارشات'], ['services','usersplus','سفارش جدید'], ['buy','cart','خرید سکه'], ['earn','coins','سکه بگیر']];
const DRAWER = [['buy','cart','خرید سکه'], ['orders','list','لیست سفارشات'], ['invite','group','کد دعوت (سکه رایگان)'], ['wheel','wheel','گردونه شانس'],
  ['top','topuser','بهترین کاربران امروز'], ['transfer','swap','انتقال سکه']];

function frame(title, body, o = {}) {
  const navKey = o.nav === undefined ? page : o.nav;
  $('#app').innerHTML = `
  <div class="top">
    ${o.hb === false ? '' : `<button class="ic" id="hb">${icon(o.back ? 'arrow' : 'menu', 26)}</button>`}
    <div class="ttl">${title}</div>
    ${o.act ? `<button class="ic" id="act" title="سابقه">${icon(o.act, 24)}</button>` : ''}
    ${user && o.coin !== false ? `<div class="pill">${fa(user.coins)} سکه</div>` : ''}
  </div>
  <div class="body">${body}</div>
  ${user && o.nav !== false ? `<nav>${NAV.map(([k, i, l]) =>
    `<button data-go="${k}" class="${navKey === k ? 'on' : ''}"><span class="i">${icon(i, 24)}</span>${l}</button>`).join('')}</nav>` : ''}`;
  document.querySelectorAll('nav [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  const hb = $('#hb'); if (hb) hb.onclick = () => o.back ? go(o.backTo || 'earn') : openDrawer();
  const ab = $('#act'); if (ab && o.onAct) ab.onclick = o.onAct;
  window.scrollTo(0, 0);
}

const phoneFa = p => (/^09\d{9}$/.test(String(p || '')) ? '98' + String(p).slice(1) : String(p || '')).replace(/\d/g, x => '۰۱۲۳۴۵۶۷۸۹'[x]);

async function doLogout() {
  await run(async () => {
    await api.logout(); try { localStorage.removeItem('rb_user'); } catch {} user = await api.me(); E.list = null; page = 'earn';
    auth = {step: 'phone', phone: '', exp: 0}; render();
  });
}

async function openDrawer() {
  const accs = (await run(() => api.accounts())) || [];
  const d = document.createElement('div'); d.className = 'ovl';
  d.innerHTML = `<div class="drawer">
    <div class="dh"><div class="dav">${avatar('', 80)}</div>
      <button class="dots" data-k="menu">${icon('dots', 28)}</button>
      <div class="drow"><span class="ph">${phoneFa(user.phone)}</span><button class="car" data-k="car">${icon('up', 22)}</button></div></div>
    <div id="accs"><div class="dsec">اکانت‌ها</div>
      <button class="acr" data-k="addacc"><span>افزودن اکانت جدید</span><span>${icon('plus', 26)}</span></button>
      ${accs.map(a => `<button class="acr ${a.active ? 'on' : ''}" data-acc="${esc(a.id)}"><span>${phoneFa(a.phone)}</span>${a.active ? `<span class="chkc">${icon('check', 18)}</span>` : ''}</button>`).join('')}
      <hr></div>
    ${DRAWER.map(([k, i, l]) => `<button class="di" data-k="${k}"><span>${icon(i, 28)}</span><span>${l}</span></button>`).join('')}
    <hr><button class="di" data-k="logout"><span>${icon('logout', 28)}</span><span>خروج از اکانت</span></button></div>`;
  d.onclick = async e => {
    const acc = e.target.closest('[data-acc]'), b = e.target.closest('[data-k]');
    if (b && b.dataset.k === 'car') {
      const el = d.querySelector('#accs'), hide = el.style.display !== 'none';
      el.style.display = hide ? 'none' : ''; b.innerHTML = icon(hide ? 'down' : 'up', 22); return;
    }
    if (b && b.dataset.k === 'menu') {
      d.remove(); const i = await sheet('اکانت ' + phoneFa(user.phone), ['خروج از این اکانت']);
      if (i === 0) doLogout(); return;
    }
    if (!b && !acc && e.target !== d) return;
    d.remove();
    if (acc) {
      if (acc.dataset.acc !== user.id) run(async () => { user = await api.switchAccount({id: acc.dataset.acc}); E.list = null; page = 'earn'; render(); });
      return;
    }
    if (!b) return;
    if (b.dataset.k === 'logout') doLogout();
    else if (b.dataset.k === 'addacc') { auth = {step: 'phone', phone: '', exp: 0, adding: true}; authView(); }
    else go(b.dataset.k);
  };
  document.body.appendChild(d);
}

function go(p) { stopE(); clearInterval(authTimer); auth.adding = false; page = p; render(); }

/* ============================================================
   ورود با شماره
   ============================================================ */
let auth = {step: 'phone', phone: '', exp: 0}, authTimer = null;

async function chatHTML() {
  if (CONFIG.MODE !== 'mock' || !auth.phone) return '';
  const msgs = await api.botInbox({phone: auth.phone});
  return `<div class="card"><h3>شبیه‌ساز چت ربات (حالت آزمایشی)</h3><div class="chat">${
    msgs.length ? msgs.map(m => `<div class="m ${m.from}">${esc(m.text).replace(/\n/g, '<br>')}</div>`).join('') : '<div class="mut">هنوز پیامی نیست</div>'}</div></div>`;
}

async function authViewBot() {
  clearInterval(authTimer);
  const url = 'https://rubika.ir/' + esc(CONFIG.BOT_ID);
  const logo = `<div style="text-align:center;margin:6px 0 14px"><img id="lg" src="${esc(CONFIG.LOGO_URL)}" alt="" style="width:104px;height:104px;border-radius:26px;box-shadow:0 6px 18px rgba(30,100,200,.25)"></div>`;
  const opts = auth.adding ? {back: true, nav: false, coin: false} : {hb: false, nav: false, coin: false};
  const ttl = auth.adding ? 'افزودن اکانت جدید' : 'ورود به حساب';

  /* مرحله‌ی ۱: شماره‌ی موبایل + ارسال کد تأیید */
  if (auth.step !== 'code') {
    frame(ttl, logo + `<div class="card"><h3>ورود با شماره‌ی موبایل</h3>
      <div class="mut" style="margin-bottom:10px">شماره‌ی موبایلت را وارد کن و دکمه‌ی «ارسال کد تأیید» را بزن؛ بعد از آن ربات روبیکا را باز می‌کنی و کد را از آن می‌گیری.</div>
      <label class="l">شماره‌ی موبایل</label>
      <input id="ph" type="tel" class="ltr" inputmode="tel" placeholder="09123456789" value="${esc(auth.phone)}" autocomplete="tel">
      <button class="btn block" id="go">ارسال کد تأیید</button></div>`, opts);
    let busy = false;
    const send = () => { if (busy) return; busy = true; $('#go').disabled = true;
      run(async () => {
        const r = await api.requestCode({phone: $('#ph').value});
        auth.phone = r.phone; auth.step = 'code'; authViewBot();
      }).finally(() => { busy = false; const g = $('#go'); if (g) g.disabled = false; });
    };
    $('#go').onclick = send;
    $('#ph').onkeydown = e => { if (e.key === 'Enter') send(); };
    return;
  }

  /* مرحله‌ی ۲: رفتن به ربات، گرفتن کد، وارد کردن کد */
  frame(ttl, logo + `<div class="card"><h3>کد را از ربات بگیر</h3>
    <div class="mut">کد تأیید برای شماره‌ی <b dir="ltr">${esc(auth.phone)}</b></div>
    <ol class="steps"><li>دکمه‌ی <b>باز کردن ربات روبیکا</b> را بزن</li>
    <li>توی ربات <b>Start</b> را بزن (یا هر پیامی بفرست)؛ کد ۸ رقمی را برایت می‌فرستد</li>
    <li>برگرد همین‌جا و کد را وارد کن</li></ol>
    <a class="btn block" href="${url}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;margin-bottom:14px">باز کردن ربات روبیکا</a>
    <input id="cd_in" class="code" type="tel" inputmode="numeric" maxlength="8" placeholder="••••••••" autocomplete="one-time-code">
    <button class="btn block" id="go">ورود</button>
    <button class="btn gray block" id="back" style="margin-top:8px">تغییر شماره</button>
    <div class="mut" style="margin-top:10px">کد ۲ دقیقه اعتبار دارد. اگر نیامد یا منقضی شد، توی ربات «ارسال مجدد» را بزن.</div></div>`, opts);
  let busy = false;
  $('#back').onclick = () => { auth.step = 'phone'; authViewBot(); };
  const enter = () => { if (busy) return; busy = true; $('#go').disabled = true;
    run(async () => {
      user = await api.verifyCode({phone: auth.phone, code: $('#cd_in').value});
      try { localStorage.setItem('rb_user', JSON.stringify(user)); } catch {}
      auth = {step: 'phone', phone: '', exp: 0}; page = 'earn'; E.list = null; render();
    }).finally(() => { busy = false; const g = $('#go'); if (g) g.disabled = false; });
  };
  $('#go').onclick = enter;
  $('#cd_in').onkeydown = e => { if (e.key === 'Enter') enter(); };
}

async function authView() {
  if (CONFIG.MODE === 'remote') return authViewBot();
  clearInterval(authTimer);
  const chat = await chatHTML();
  let body = '', title = auth.adding ? 'افزودن اکانت جدید' : 'ورود با شماره‌ی موبایل';
  if (auth.step === 'phone') {
    body = `<div class="card"><label class="l">شماره‌ی موبایل</label>
      <input id="ph" type="tel" class="ltr" inputmode="tel" placeholder="09123456789" value="${esc(auth.phone)}" autocomplete="tel">
      <button class="btn block" id="go">دریافت کد</button>
      <div class="mut" style="margin-top:10px">کد ورود از طریق ربات روبیکا برایت ارسال می‌شود.</div></div>`;
  } else if (auth.step === 'bot') {
    title = 'اول ربات را فعال کن';
    body = `<div class="card"><h3>فعال‌سازی ربات</h3><ol class="steps">
        <li>در روبیکا ربات <a href="https://rubika.ir/${esc(CONFIG.BOT_ID)}" target="_blank" rel="noopener" dir="ltr" style="font-weight:700;color:var(--pri)">@${esc(CONFIG.BOT_ID)}</a> را باز کن</li><li>دکمه‌ی <b>Start</b> را بزن</li>
        <li>با دکمه‌ی «اشتراک شماره»، شماره‌ی <b dir="ltr">${esc(auth.phone)}</b> را بفرست</li></ol>
      <button class="btn block" id="go">${CONFIG.MODE === 'mock' ? 'شبیه‌سازی: Start و اشتراک شماره' : 'ربات را فعال کردم'}</button>
      <button class="btn gray block" id="back" style="margin-top:8px">تغییر شماره</button></div>`;
  } else {
    title = 'کد را وارد کن';
    body = `<div class="card"><div class="mut">کد ارسال‌شده به ربات برای <b dir="ltr">${esc(auth.phone)}</b></div>
      <input id="cd_in" class="code" type="tel" inputmode="numeric" maxlength="5" placeholder="•••••">
      <div class="mut" id="cd" style="margin-bottom:10px"></div>
      <button class="btn block" id="go">ورود</button>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn gray" style="flex:1" id="resend">ارسال دوباره</button>
      <button class="btn gray" style="flex:1" id="back">تغییر شماره</button></div></div>`;
  }
  frame(title, body + chat, auth.adding ? {back: true, nav: false, coin: false} : {hb: false, nav: false, coin: false});

  const ask = () => run(async () => {
    const r = await api.requestCode({phone: auth.phone});
    if (r.needBot) { auth.phone = r.phone; if (auth.step === 'bot') toast('هنوز ربات فعال نشده', true); auth.step = 'bot'; return authView(); }
    auth.phone = r.phone; auth.step = 'code'; auth.exp = Date.now() + r.ttl * 1000; authView();
  });
  if (auth.step === 'phone') $('#go').onclick = () => { auth.phone = $('#ph').value; ask(); };
  else if (auth.step === 'bot') {
    $('#go').onclick = () => run(async () => { if (CONFIG.MODE === 'mock') await api.botStart({phone: auth.phone}); ask(); });
    $('#back').onclick = () => { auth.step = 'phone'; authView(); };
  } else {
    const tick = () => { const el = $('#cd'); if (!el) return clearInterval(authTimer);
      const s = Math.max(0, Math.ceil((auth.exp - Date.now()) / 1000));
      el.textContent = s > 0 ? `اعتبار کد: ${fa(Math.floor(s / 60))}:${fa(String(s % 60).padStart(2, '0'))}` : 'کد منقضی شد'; };
    tick(); authTimer = setInterval(tick, 1000);
    $('#go').onclick = () => run(async () => {
      user = await api.verifyCode({phone: auth.phone, code: $('#cd_in').value});
      auth = {step: 'phone', phone: '', exp: 0}; page = 'earn'; E.list = null; render();
    });
    $('#resend').onclick = ask;
    $('#back').onclick = () => { auth.step = 'phone'; authView(); };
  }
}

/* ============================================================
   صفحه‌ی اصلی: سکه بگیر
   ============================================================ */
let E = {list: null, idx: 0, phase: 'idle', t0: 0, iv: null};
function stopE() { clearInterval(E.iv); E.iv = null; E.phase = 'idle'; }

async function earnView() {
  const alive = beginView();
  if (!E.list) {
    frame('عضو بگیر روبیکا', '<div class="empty">در حال بارگذاری…</div>', {nav: 'earn'});
    const l = await run(() => api.tasks()); if (!alive()) return;
    if (!l) {
      frame('عضو بگیر روبیکا', '<div class="empty">اتصال به سرور برقرار نشد</div><button class="btn block" id="rl">تلاش دوباره</button>', {nav: 'earn'});
      $('#rl').onclick = () => earnView(); return;
    }
    E.list = l; E.idx = 0; E.phase = 'idle';
  }
  drawEarn();
}

function joinLabel(t) {
  if (E.phase === 'waiting') {
    const s = Math.max(0, CONFIG.VERIFY_WAIT - Math.floor((Date.now() - E.t0) / 1000));
    return `${icon('hourglass', 28)}<span>${fa(s)}</span>`;
  }
  if (E.phase === 'ready') return `${icon('checkcircle', 28)}<span>بررسی عضویت</span>`;
  return `${icon('coins', 34)}<span>دریافت سکه</span>${t.reward ? `<b>+${fa(t.reward)}</b>` : ''}`;
}

function drawEarn() {
  const s = getS(), t = E.list[E.idx];
  const toggles = `<div class="card tog">
    <label class="sw"><span>عضویت<br>خودکار</span><input type="checkbox" id="tAuto" ${s.auto ? 'checked' : ''}><i></i></label><div class="vr"></div>
    <label class="sw"><span>عضویت<br>همزمان</span><input type="checkbox" id="tSim" ${s.simul ? 'checked' : ''}><i></i></label></div>`;
  let body = toggles + '<div class="cap">با عضو شدن در کانال دیگران سکه رایگان کسب کنید.</div>';
  if (!t) {
    body += `<div id="avbox">${avatar('', 250)}</div>
      <div class="chname" style="color:var(--red)">کانالی موجود نیست</div>
      <div class="acts"><button class="ob" disabled style="opacity:.4">${icon('arrow', 34)}</button>
        <button class="main" disabled>${icon('coins', 34)}<span>دریافت سکه</span></button>
        <button class="ob" disabled style="opacity:.4">${icon('warn', 34)}</button></div>
      <div style="text-align:center;margin-top:14px"><button class="lnk" id="reload">بارگذاری دوباره</button></div>`;
  } else {
    body += `<div id="avbox">${avatar('', 250)}</div>
      <div class="chname">${esc(t.title || idOf(t.link))}${t.mine ? ' <small style="color:var(--mut);font-weight:400">(کانال خودت)</small>' : ''}</div>
      <div class="chk">
        <label class="ck"><input type="checkbox" id="cMute" ${s.mute ? 'checked' : ''}><i></i><span>بی‌صدا کردن کانال بعد از عضویت</span></label></div>
      <div class="acts"><button class="ob" id="bNext" title="کانال بعدی">${icon('arrow', 34)}</button>
        <button class="main" id="bJoin" ${E.phase === 'waiting' ? 'disabled' : ''}>${joinLabel(t)}</button>
        <button class="ob" id="bRep" style="color:var(--red)" title="گزارش">${icon('warn', 34)}</button></div>`;
  }
  frame('عضو بگیر روبیکا', body, {nav: 'earn'});

  $('#tAuto').onchange = e => setS('auto', e.target.checked);
  $('#tSim').onchange = e => setS('simul', e.target.checked);
  if (!t) { $('#reload').onclick = () => { E.list = null; earnView(); }; return; }
  $('#cMute').onchange = e => setS('mute', e.target.checked);
  $('#bNext').onclick = () => { stopE(); E.idx = (E.idx + 1) % E.list.length; drawEarn(); };
  $('#bRep').onclick = async () => {
    const i = await sheet('گزارش این کانال', ['محتوای نامناسب', 'لینک خراب یا کانال وجود ندارد', 'کانال خصوصی است / امکان عضویت نیست']);
    if (i < 0) return;
    await run(async () => { await api.report({orderId: t.id, reason: i}); toast('گزارش ثبت شد، ممنون'); removeCurrent(); });
  };
  $('#bJoin').onclick = joinClick;
  if (E.phase === 'waiting') startTick();
}

function removeCurrent() {
  stopE(); E.list.splice(E.idx, 1);
  if (E.idx >= E.list.length) E.idx = 0;
  drawEarn();
}

function startTick() {
  clearInterval(E.iv);
  E.iv = setInterval(() => {
    if (page !== 'earn') return stopE();
    const b = $('#bJoin'); if (!b) return stopE();
    if (Date.now() - E.t0 >= CONFIG.VERIFY_WAIT * 1000) {
      if (document.hidden) return;           // هنوز توی روبیکاست؛ تا برگشتن صبر کن
      clearInterval(E.iv); E.phase = 'ready'; b.disabled = false; b.innerHTML = joinLabel(E.list[E.idx]);
      doVerify();                            // برگشته و ۴ ثانیه گذشته → سکه خودکار
    } else b.innerHTML = joinLabel(E.list[E.idx]);
  }, 400);
}
document.addEventListener('visibilitychange', () => {   // برگشتن به برنامه: همین‌جا چک کن
  if (!document.hidden && E.phase === 'waiting' && Date.now() - E.t0 >= CONFIG.VERIFY_WAIT * 1000 && page === 'earn') {
    clearInterval(E.iv); E.phase = 'ready'; const b = $('#bJoin'); if (b) { b.disabled = false; b.innerHTML = joinLabel(E.list[E.idx]); }
    doVerify();
  }
});

function joinClick() {
  const t = E.list[E.idx]; if (!t) return;
  if (E.phase === 'ready') return doVerify();
  if (E.phase !== 'idle') return;
  const w = window.open(t.link, '_blank');
  if (w) { try { w.opener = null } catch {} }
  else {     // در WebView اپ، window.open گاهی null برمی‌گرداند؛ لینک معمولی کار می‌کند
    const a = document.createElement('a'); a.href = t.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
    document.body.appendChild(a); a.click(); a.remove();
  }
  E.phase = 'waiting'; E.t0 = Date.now();
  api.joinStart({orderId: t.id}).catch(() => {});
  const b = $('#bJoin'); b.disabled = true; b.innerHTML = joinLabel(t);
  startTick();
}

async function doVerify() {
  const t = E.list[E.idx]; if (!t || E.busy) return;
  E.busy = true;
  const b = $('#bJoin'); if (b) b.disabled = true;
  const r = await run(() => api.verifyJoin({orderId: t.id})).finally(() => { E.busy = false; });
  if (!r) { if (b) b.disabled = false; return; }
  setCoins(r.coins); toast((r.reward ? `+${fa(r.reward)} سکه ✓` : 'عضویت ثبت شد ✓ (کانال خودت سکه ندارد)') + (getS().mute ? ' — کانال را بی‌صدا کن' : ''));
  removeCurrent();
  if (getS().auto && E.list.length) setTimeout(() => { if (page === 'earn') joinClick(); }, 700);   // «خودکار»: رفتن به کانال بعدی
}

/* ------------------------------------------------------------
   اتصال به پرداخت مایکت (Myket In-App Billing)
   این صفحه فقط «شناسه‌ی محصول (SKU)» را به لایه‌ی native می‌دهد و نتیجه را می‌گیرد.
   کار شما در مایکت:
   ۱) در پنل توسعه‌دهنده‌ی مایکت برای هر SKU داخل CONFIG.PACKS یک «محصول درون‌برنامه‌ای مصرفی» بسازید.
   ۲) در اپ اندروید (WebView) یک JavascriptInterface با نام MyketBridge بسازید که این متدها را داشته باشد:
        MyketBridge.purchase(sku, callbackName)   → خرید را با کتابخانه‌ی مایکت شروع کند و بعد از پایان
                                                    window[callbackName]({ok:true, sku, token, orderId}) یا
                                                    window[callbackName]({ok:false, error:'پیام'}) را صدا بزند
        MyketBridge.consume(token)                → (اختیاری ولی لازم) بعد از تأیید سرور، خرید را مصرف کند
   ۳) سمت سرور (تابع buyCoins) token را با API مایکت راستی‌آزمایی کند، orderId/token تکراری را رد کند
      و فقط بعد از تأیید، سکه بدهد. سکه هرگز سمت کلاینت اضافه نمی‌شود.
   ------------------------------------------------------------ */
const Pay = {
  busy: false,
  get ready() { return !!(window.MyketBridge && typeof window.MyketBridge.purchase === 'function'); },
  start(sku) {
    return new Promise((res, rej) => {
      if (!Pay.ready) return rej(new Error('پرداخت فقط در برنامه‌ی نصب‌شده از مایکت امکان‌پذیر است'));
      let done = false;
      const fin = (fn, v) => { if (done) return; done = true; clearTimeout(tm); delete window.rbPayResult; fn(v); };
      const tm = setTimeout(() => fin(rej, new Error('پاسخی از مایکت دریافت نشد؛ دوباره امتحان کن')), 5 * 60 * 1000);
      window.rbPayResult = r => {
        if (typeof r === 'string') { try { r = JSON.parse(r); } catch { r = {ok: false}; } }
        if (r && r.ok && r.token) fin(res, r); else fin(rej, new Error((r && r.error) || 'پرداخت لغو شد'));
      };
      try { window.MyketBridge.purchase(sku, 'rbPayResult'); }
      catch (e) { fin(rej, new Error('شروع پرداخت ممکن نشد')); }
    });
  },
  consume(token) { try { if (window.MyketBridge && window.MyketBridge.consume) window.MyketBridge.consume(token); } catch {} }
};

async function purchase(i) {
  const pk = CONFIG.PACKS[i];
  if (!pk || Pay.busy) return;
  Pay.busy = true;
  try {
    let r;
    if (CONFIG.MODE === 'mock') r = await api.buyCoins({pack: i, sku: pk[2]});   // حالت آزمایشی: بدون پرداخت واقعی
    else {
      const p = await Pay.start(pk[2]);                                          // ۱) پرداخت در مایکت
      r = await api.buyCoins({pack: i, sku: pk[2], token: p.token, orderId: p.orderId});   // ۲) تأیید و شارژ در سرور
      Pay.consume(p.token);                                                      // ۳) مصرف خرید
    }
    setCoins(r.coins); toast('سکه به حساب شما اضافه شد ✓');
  } finally { Pay.busy = false; }
}

    `<div class="rank"><div class="n">${fa(i + 1)}</div>${avatar('', 38)}<div style="${x.me ? 'font-weight:700;color:var(--pri)' : ''}">${/^\d{3}$/.test(x.name) ? '•••• ' + fa(x.name) : esc(x.name)}${x.me ? ' (تو)' : ''}</div><div class="s">${icon('coins', 18)} ${fa(x.score)}</div></div>`).join('')}</div>
    <div class="mut" style="text-align:center">۱۰ نفر برتر امروز؛ امتیاز = سکه‌ی کسب‌شده از عضویت در کانال‌ها. هر شب ساعت ۱۲ از صفر شروع می‌شود.</div>`, {back: true, nav: false});
}

async function showTransferHistory() {
  const l = await run(() => api.transferHistory()); if (!l) return;
  const d = document.createElement('div'); d.className = 'ovl';
  d.innerHTML = `<div class="sheet" style="max-height:78vh;overflow:auto">
    <div class="item" style="margin-bottom:8px"><h3 style="margin:0;display:flex;align-items:center;gap:8px">${icon('clock', 22)}<span>سابقه ارسال و دریافت</span></h3>
    <button class="ic" data-x="1">${icon('close', 22)}</button></div>
    ${l.length ? l.map(t => `<div class="hrow"><span class="hic ${t.amount > 0 ? 'in' : 'out'}">${icon(t.amount > 0 ? 'recv' : 'send', 20)}</span>
      <div style="flex:1"><div>${esc(t.note)}</div><div class="mut" style="font-size:12px">${jdt(t.t)}</div></div>
      <b class="${t.amount > 0 ? 'pos' : 'neg'}">${t.amount > 0 ? '+' : ''}${fa(t.amount)}</b></div>`).join('') : '<div class="empty">هنوز انتقالی انجام نشده</div>'}</div>`;
  d.onclick = e => { if (e.target === d || e.target.closest('[data-x]')) d.remove(); };
  document.body.appendChild(d);
}

function transferView() {
  frame('انتقال سکه', `<div class="card"><label class="l">${CONFIG.MODE === 'remote' ? 'شناسه‌ی حساب گیرنده (۸ رقمی)' : 'شماره‌ی موبایل گیرنده'}</label><input id="tp" type="tel" class="ltr" placeholder="${CONFIG.MODE === 'remote' ? '12345678' : '09123456789'}">
    <label class="l">تعداد سکه (حداقل ۵)</label><input id="ta" type="number" inputmode="numeric">
    <button class="btn block" id="go">انتقال</button></div><div class="card mut">گیرنده باید در برنامه ثبت‌نام کرده باشد. انتقال قابل برگشت نیست.</div>`, {back: true, nav: false, act: 'clock', onAct: showTransferHistory});
  $('#go').onclick = () => run(async () => {
    if (!confirm('انتقال انجام شود؟')) return;
    const r = await api.transfer({phone: $('#tp').value, amount: $('#ta').value}); setCoins(r.coins); toast('انتقال انجام شد ✓'); transferView();
  });
}

/* ============================================================
   پنل مدیریت (مخفی)
   باز کردن: ۷ ضربه‌ی پشت‌سرهم روی عنوان بالای صفحه (یا لوگوی صفحه‌ی ورود)
   رمز در برنامه ذخیره نیست؛ سرور آن را بررسی می‌کند.
   ============================================================ */
const Admin = (() => {
  let tok = ''; try { tok = sessionStorage.getItem('rb_adm') || ''; } catch {}
  const setTok = t => { tok = t; try { t ? sessionStorage.setItem('rb_adm', t) : sessionStorage.removeItem('rb_adm'); } catch {} };
  let root = null, tab = 'stats', tf = 'open', uq = '';
  const TYPES = {members: 'عضو', seen: 'سین', react: 'واکنش', poll: 'نظرسنجی'};

  async function ac(name, payload = {}) {
    let res;
    try { res = await fetch(CONFIG.BASE_URL + '/' + name, {method: 'POST', headers: {'Content-Type': 'application/json', 'x-admin-token': tok}, body: JSON.stringify(payload)}); }
    catch { throw new Error('اتصال به سرور برقرار نشد'); }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { setTok(''); const e = new Error(data.error || 'نشست مدیر منقضی شده'); e.code = 401; throw e; }
    if (!res.ok) throw new Error(data.error || 'خطای سرور');
    return data;
  }
  const close = () => { if (root) { root.remove(); root = null; } };
  const guard = async fn => {
    try { return await fn(); }
    catch (e) { if (e && e.code === 401) { close(); loginSheet(); } toast((e && e.message) || 'خطا', true); }
  };
  const body = () => root && root.querySelector('#adb');

  function loginSheet() {
    const d = document.createElement('div'); d.className = 'ovl'; d.style.zIndex = 40;
    d.innerHTML = `<div class="sheet"><h3 style="margin:0 0 10px">ورود مدیر</h3>
      <input id="adp" type="password" class="ltr" placeholder="رمز" autocomplete="off">
      <button class="btn block" id="adg">ورود</button></div>`;
    d.onclick = e => { if (e.target === d) d.remove(); };
    document.body.appendChild(d);
    const inp = d.querySelector('#adp');
    const go = () => guard(async () => { const r = await ac('adminLogin', {password: inp.value}); setTok(r.token); d.remove(); open(); });
    d.querySelector('#adg').onclick = go;
    inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    setTimeout(() => inp.focus(), 60);
  }

  function open() {
    if (!tok) return loginSheet();
    close();
    root = document.createElement('div'); root.className = 'ovl'; root.style.zIndex = 30;
    root.innerHTML = `<div class="admbox">
      <div class="top"><button class="ic" id="adx">${icon('close', 26)}</button><div class="ttl">پنل مدیریت</div><button class="ic" id="adq" title="خروج مدیر">${icon('logout', 24)}</button></div>
      <div class="tabs2" style="margin:0"><button data-t="stats">آمار</button><button data-t="users">کاربران</button><button data-t="tickets">پشتیبانی</button></div>
      <div class="body" id="adb" style="padding-bottom:30px"></div></div>`;
    document.body.appendChild(root);
    root.querySelector('#adx').onclick = close;
    root.querySelector('#adq').onclick = () => guard(async () => { try { await ac('adminLogout'); } catch {} setTok(''); close(); toast('از پنل مدیریت خارج شدی'); });
    root.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
    draw();
  }

  function draw() {
    root.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    ({stats: dStats, users: dUsers, tickets: dTickets})[tab]();
  }

  const dStats = () => guard(async () => {
    const b = body(); b.innerHTML = '<div class="empty">در حال بارگذاری…</div>';
    const s = await ac('adminStats'); if (!body()) return;
    const row = (l, v) => `<div class="card"><div class="item"><span>${l}</span><b style="font-size:20px">${fa(v)}</b></div></div>`;
    body().innerHTML = row('تعداد کاربران', s.users) + row('مجموع سکه‌ی کاربران', s.coins) + row('سفارش‌های فعال', s.activeOrders) +
      row('پیام‌های بی‌پاسخ', s.openTickets) + row('کل پیام‌های پشتیبانی', s.allTickets) +
      '<button class="btn block" id="adgo">رفتن به پیام‌های بی‌پاسخ</button>';
    body().querySelector('#adgo').onclick = () => { tab = 'tickets'; tf = 'open'; draw(); };
  });

  const dUsers = () => guard(async () => {
    const b = body();
    b.innerHTML = `<input id="auq" type="text" placeholder="جستجو: شماره، شناسه‌ی ۸ رقمی یا نام" value="${esc(uq)}"><div id="aul"></div>`;
    const list = b.querySelector('#aul'); let off = 0, shown = 0;
    const load = more => guard(async () => {
      if (!more) { off = 0; shown = 0; list.innerHTML = '<div class="empty">در حال بارگذاری…</div>'; }
      const r = await ac('adminUsers', {q: uq, offset: off}); if (!body()) return;
      const html = r.users.map(u => `<div class="card adu" data-id="${esc(u.id)}" style="cursor:pointer;padding:12px 14px;margin-bottom:10px">
        <div class="item"><b>${esc(u.username)}</b><span class="badge">${fa(u.coins)} سکه</span></div>
        <div class="mut" dir="ltr" style="text-align:right">${esc(u.phone || '—')} · ID ${esc(u.pid || '—')}</div>
        <div class="mut" style="font-size:12px">${jdt(u.created)}</div></div>`).join('');
      shown += r.users.length; off += r.users.length;
      const old = list.querySelector('.adm-more'); if (old) old.remove();
      if (!more) list.innerHTML = `<div class="mut" style="margin:4px 2px 10px">${fa(r.total)} کاربر</div>`;
      list.insertAdjacentHTML('beforeend', html || (more ? '' : '<div class="empty">کاربری پیدا نشد</div>'));
      if (shown < r.total) { list.insertAdjacentHTML('beforeend', '<button class="btn gray block adm-more">نمایش بیشتر</button>'); list.querySelector('.adm-more').onclick = () => load(true); }
    });
    let tm; b.querySelector('#auq').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { uq = e.target.value; load(false); }, 400); };
    list.onclick = e => { const c = e.target.closest('.adu'); if (c) userSheet(c.dataset.id); };
    load(false);
  });

  const userSheet = id => guard(async () => {
    const r = await ac('adminUser', {id}); const u = r.user;
    const d = document.createElement('div'); d.className = 'ovl'; d.style.zIndex = 40;
    d.innerHTML = `<div class="sheet" style="max-height:88vh;overflow:auto">
      <h3 style="margin:0 0 6px">${esc(u.username)}</h3>
      <div class="mut" dir="ltr" style="text-align:right">${esc(u.phone || '—')}</div>
      <div class="mut">شناسه‌ی حساب: <b dir="ltr">${esc(u.pid || '—')}</b> · موجودی: <b>${fa(u.coins)}</b> سکه</div>
      <div class="mut">کد دعوت: <b dir="ltr">${esc(u.invite || '—')}</b> · دعوت موفق: ${fa(u.invited)}</div>
      <div class="mut" style="font-size:12px;margin-bottom:8px">عضویت: ${jdt(u.created)}</div>
      <h3 style="margin:12px 0 4px;font-size:15px">سفارش‌ها</h3>
      ${r.orders.length ? r.orders.map(o => `<div class="tx"><span>${TYPES[o.type] || esc(o.type)} · ${esc(o.title || o.link)}</span><span>${fa(o.done)}/${fa(o.target)}${o.status === 'cancelled' ? ' (لغو)' : ''}</span></div>`).join('') : '<div class="mut">سفارشی نیست</div>'}
      <h3 style="margin:12px 0 4px;font-size:15px">آخرین تراکنش‌ها</h3>
      ${r.tx.length ? r.tx.map(t => `<div class="tx"><span>${esc(t.note)}</span><span class="${t.amount >= 0 ? 'pos' : 'neg'}" dir="ltr">${t.amount > 0 ? '+' : ''}${fa(t.amount)}</span></div>`).join('') : '<div class="mut">تراکنشی نیست</div>'}
      <button class="btn gray block" id="adc" style="margin-top:14px">بستن</button></div>`;
    d.onclick = e => { if (e.target === d || e.target.id === 'adc') d.remove(); };
    document.body.appendChild(d);
  });

  const dTickets = () => guard(async () => {
    const b = body();
    b.innerHTML = `<div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn ${tf === 'open' ? '' : 'gray'}" style="flex:1" data-f="open">بی‌پاسخ</button>
      <button class="btn ${tf === 'all' ? '' : 'gray'}" style="flex:1" data-f="all">همه</button></div><div id="atl"><div class="empty">در حال بارگذاری…</div></div>`;
    b.querySelectorAll('[data-f]').forEach(x => x.onclick = () => { tf = x.dataset.f; dTickets(); });
    const r = await ac('adminTickets', {filter: tf}); if (!body()) return;
    const box = body().querySelector('#atl');
    box.innerHTML = r.length ? r.map(t => `<div class="card" data-id="${esc(t.id)}">
      <div class="item"><b>${esc(t.subject)}</b><span class="badge">${esc(t.status)}</span></div>
      <div class="mut" style="font-size:12px">${t.user ? esc(t.user.username) + ' · ID ' + esc(t.user.pid || '—') + ' · ' + esc(t.user.phone || '—') : 'کاربر حذف‌شده'} · ${jdt(t.t)}</div>
      <p style="margin:8px 0;white-space:pre-wrap">${esc(t.text)}</p>
      <textarea placeholder="پاسخ پشتیبانی…" style="min-height:90px;margin-bottom:8px">${esc(t.reply || '')}</textarea>
      <button class="btn block" data-send>${t.reply ? 'ویرایش پاسخ' : 'ارسال پاسخ'}</button></div>`).join('')
      : `<div class="empty">${tf === 'open' ? 'پیام بی‌پاسخی نیست 🎉' : 'پیامی نیست'}</div>`;
    box.onclick = e => {
      const btn = e.target.closest('[data-send]'); if (!btn) return;
      const card = btn.closest('[data-id]'); btn.disabled = true;
      guard(async () => { await ac('adminReply', {ticketId: card.dataset.id, reply: card.querySelector('textarea').value}); toast('پاسخ ارسال شد ✓'); dTickets(); })
        .finally(() => { btn.disabled = false; });
    };
  });

  /* ۷ ضربه‌ی پشت‌سرهم (فاصله‌ی هر ضربه کمتر از ۱٫۵ ثانیه) روی عنوان بالای صفحه یا لوگوی ورود */
  let taps = 0, last = 0;
  document.addEventListener('click', e => {
    if (!e.target.closest || !e.target.closest('.top .ttl, #lg')) return;
    if (root && root.contains(e.target)) return;
    const n = Date.now(); taps = n - last < 1500 ? taps + 1 : 1; last = n;
    if (taps >= 7) { taps = 0; open(); }
  });
  return {open};
})();

/* ============================================================ */
function render() {
  viewSeq++;
  if (!user) return authView();
  if (CACHE.uid !== user.id) { CACHE = {uid: user.id}; setTimeout(prefetch, 2500); }
  ({earn: earnView, services: servicesView, order: orderView, orders: ordersView, buy: buyView, support: supportView,
    invite: inviteView, wheel: wheelView, top: topView, transfer: transferView})[page]();
}
(async () => {
  // همیشه فوراً چیزی نشان بده؛ قبلاً تا رسیدن جواب سرور صفحه سفید می‌ماند
  let cached = null; try { cached = JSON.parse(localStorage.getItem('rb_user') || 'null'); } catch {}
  const hasCache = !!(cached && Session.token && cached.id === Session.active);
  if (hasCache) { user = cached; render(); }
  else $('#app').innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px"><img src="${CONFIG.LOGO_URL}" alt="" style="width:110px;height:110px;border-radius:28px"><div class="mut">در حال اتصال…</div></div>`;
  try {
    const u = await api.me();
    if (u) { try { localStorage.setItem('rb_user', JSON.stringify(u)); } catch {} if (hasCache) { user = u; setCoins(u.coins); } else { user = u; render(); } }
    else { try { localStorage.removeItem('rb_user'); } catch {} user = null; render(); }
  } catch (e) {
    if (hasCache) return;                       // اینترنت ضعیف است؛ با اطلاعات قبلی ادامه بده
    $('#app').innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;padding:24px;text-align:center"><img src="${CONFIG.LOGO_URL}" alt="" style="width:90px;height:90px;border-radius:24px"><div>اتصال به سرور برقرار نشد</div><button class="btn" id="retryBoot">تلاش دوباره</button></div>`;
    $('#retryBoot').onclick = () => location.reload();
  }
})();
if (CONFIG.MODE === 'remote') setInterval(() => { if (user && !document.hidden) api.me().catch(() => {}); }, 90000);   // سرور را بیدار نگه می‌دارد
</script>
</body>
